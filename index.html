<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Realm Nexus — Private access</title>
<style>
  html,body{margin:0;min-height:100%;background:#0b0d13;color:#e8ecf5;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box}
  .card{width:min(420px,100%);background:#141a2b;border:1px solid #2a3148;
    border-radius:16px;padding:32px 24px;text-align:center}
  .mark{font-size:34px;color:#8f9bff}
  h1{font-size:22px;margin:10px 0 4px}
  h1 em{color:#8f9bff;font-style:normal}
  p{font-size:13.5px;color:#9aa3bb;line-height:1.5}
  .btn{display:block;width:100%;box-sizing:border-box;margin-top:12px;padding:12px;
    border-radius:10px;border:0;font-size:15px;font-weight:700;cursor:pointer;
    text-decoration:none;background:#2f54eb;color:#fff}
  .btn.ghost{background:transparent;border:1px solid #2a3148;color:#c6cde0;font-weight:600}
  /* Owner: paste your Discord invite link into the href below, then
     delete this comment. Until then the button stays hidden. */
  #discordBtn{display:none}
</style>
</head>
<body>
<div class="card">
  <div class="mark">✦</div>
  <h1>REALM <em>NEXUS</em></h1>
  <p>This Nexus is key-locked. Enter with your access key — each key works on one device only.</p>
  <a class="btn" href="https://perchance.org/nexusrealm-com">Enter with my key</a>
  <a id="discordBtn" class="btn ghost" href="PASTE-DISCORD-INVITE-HERE">Join our Discord server to get a key!</a>
  <p>No key yet? Keys are handed out on our Discord server.</p>
</div>
</body>
</html>
